<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Redaktion · BSG Stahl Tennis</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script>
    // Auf dem eigenen Rechner (localhost) kann Sveltia CMS nur in Chrome/Edge/Brave direkt
    // auf die Dateien zugreifen. In Safari & Firefox leiten wir zur lokalen Redaktion um,
    // die in jedem Browser funktioniert. Online (www.bsg-tennis.de/admin) gilt das nicht –
    // dort meldet man sich über GitHub an und es klappt in allen aktuellen Browsern.
    if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname) && !('showDirectoryPicker' in window)) {
      location.replace('/redaktion/');
    }
  </script>
</head>
<body>
  <!-- Sveltia CMS: Redaktionsoberfläche für News, Termine & Co. Konfiguration in config.yml -->
  <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
</body>
</html>
